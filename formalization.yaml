status:
  scope: >-
    The submitted claim is irrationality of Li₂(1/2), expressed as the real
    series with index k >= 0 and term (1/2)^(k+1)/(k+1)^2. No claim about
    other parameters, transcendence, or algebraic independence is submitted.
