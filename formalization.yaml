# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Irrationality of Li₂(1/2)"
  description: >-
    A Lean formalization of the irrationality of
    Li₂(1/2) = Σ_{n≥1} 2^(-n)/n².
    The proof is inspired by A. Fauzan's work on the irrationality of
    ζ(5) and builds on Moritz Firsching's Lean formalization in mo271/Zeta5.
    The central idea is to establish the irrationality of a real number r
    by constructing a sequence of integer polynomials P_n whose values
    P_n(r) decay rapidly as n tends to infinity, while for every rational
    q, P_n(q) ≠ 0 for infinitely many n. Analytic umbral calculus was used
    to find suitable polynomials Q_n with rational coefficients.
    Random matrix theory provides rapid decay of Q_n(r) as n tends to
    infinity. Estimates of p-adic valuations, together with the prime
    number theorem, ensure that the values P_n(r) of the corresponding
    primitive integer polynomials also decay rapidly as n tends to
    infinity, completing the proof.
    Similar methods may apply to other values Li₂(1/n), but those cases
    are not included here.
    The compared theorem depends on propext, Classical.choice and
    Quot.sound and on nothing else, and there is no sorry outside the
    one deliberate hole in Challenge.lean.
  authors:
    - "Qian Tang"
  responsible_maintainers:
    - "Qian Tang"
  license: "Apache-2.0"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J72", "33B30"]

status:
  scope: >-
    Complete, with no unproved step. Formalized: Li₂(1/2) ∉ ℚ, stated in
    Challenge.lean as
    Irrational (∑' k : ℕ, (1/2 : ℝ) ^ (k + 1) / ((k : ℝ) + 1) ^ 2), which is
    the series Σ_{n≥1} 2^(−n)/n² written with index k = n − 1. Nothing is
    assumed from the literature.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "li2_one_half_irrational"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    The formal statement expresses Li₂(1/2) by its defining real series,
    with the summation index shifted from n ≥ 1 to k ≥ 0.
    This is an original proof using methods adapted from the cited
    work on ζ(5) and analytic umbral calculus.

