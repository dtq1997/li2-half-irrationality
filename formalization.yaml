# ---------------------------------------------------------------------------
# How this was produced.
# ---------------------------------------------------------------------------
automation:
  methods:
    - method: "agent"
      models: ["GPT-6 Astra (OpenAI)", "Claude Opus 5.5 (Anthropic)"]
      framework: "Codex; Claude Code"
      role: >-
        Wrote and revised the Lean formalization under the author's
        direction: formalizing the polynomial construction, proving the
        analytic and arithmetic estimates, and combining these results
        into the proof of the main theorem. Adapted auxiliary Lean code
        from the projects listed under related_formalizations, with
        attribution recorded in NOTICE. Also wrote Challenge.lean and
        Solution.lean, prepared comparator.json for the Palomar submission,
        and ran compilation and proof checks.

review:
  status: "self-assessed"
  notes: >-
    The correspondence between the intended mathematical claim and the
    statement in Challenge.lean was checked by the author. The author
    has not fully reviewed the rest of the Lean code. Every formalized
    proof step is checked by Lean.

# ---------------------------------------------------------------------------
# Limitations, stated so that a reader can calibrate the claim.
# ---------------------------------------------------------------------------
known_gaps: []

limitations:
  - >-
    The proof is presented as a Lean development. No informal write-up
    accompanies it.
  - >-
    The compared theorem depends on propext, Classical.choice and
    Quot.sound, and on nothing else. There is no sorry in Li2Unified/
    or Solution.lean, and no project-defined axiom, native_decide,
    unsafe declaration, @[implemented_by] or Float in the proof
    development.
  - >-
    The proof includes finite computations carried out using
    decide +kernel. These computations are checked by the Lean kernel.
  - >-
    Challenge.lean states the result with one deliberate sorry;
    that is the Comparator convention, and Solution.lean supplies
    the proof.

# ---------------------------------------------------------------------------
# How the stated problem corresponds to the Lean declaration.
# ---------------------------------------------------------------------------
alignment:
  statements:
    - source: "Calegari–Dimitrov–Tang, Remark 2.8.2: irrationality of Li₂(1/n), case n = 2"
      lean: "li2_one_half_irrational"
      module: "Challenge (statement), Solution (proof)"
      status: "author-checked"
      note: >-
        The statement of record, compared by Comparator. The Challenge and the
        Solution state the same real series literally. Solution.lean obtains it
        from Li2Unified.Instances.PosHalf.irrational_series.

acknowledgements: "I thank Siqi Liu for suggesting the problem and for helpful discussions. I also thank YiXiang Wei for support and discussions."
