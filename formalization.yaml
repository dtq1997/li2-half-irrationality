    authors: ["Qian Tang"]
    contributors:
      - name: "Siqi Liu"
        role: "problem-proposer"
    id: "https://github.com/dtq1997/li2-half-irrationality"
    type: "original-proof"
    relationship: "other"
    note: >-
      The author identifies this repository as the first presentation of the
      result. This records the author's account of its origin; priority and
      novelty have not been independently established.
