# Submission metadata. Complete this port's verification before submission.
version: "v0.4"
project:
  name: "Irrationality of Li₂(1/2)"
  description: >-
    This project formalizes the irrationality of the real number
    Li₂(1/2) = sum over n >= 1 of 2^(-n)/n^2. The selected theorem states
    irrationality directly for the real infinite series, without additional
    mathematical hypotheses. The Challenge uses the standard Mathlib
    definitions of real numbers, infinite summation, and irrationality.
  authors:
    - "Qian Tang"
  responsible_maintainers:
    - "Qian Tang"
  license: "Apache-2.0"
classification:
  arxiv: ["math.NT"]
  msc2020: ["11J72"]
